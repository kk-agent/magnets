name: Agent Chain — Auto-trigger next task

on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  chain-next:
    if: github.event.pull_request.merged == true || github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine next phase
        id: next
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'phase-next',
              sort: 'created',
              direction: 'asc',
              per_page: 1
            });
            
            if (issues.length > 0) {
              const next = issues[0];
              core.setOutput('has_next', 'true');
              core.setOutput('issue_number', next.number);
              core.setOutput('issue_title', next.title);
              console.log(`Next task: #${next.number} — ${next.title}`);
            } else {
              core.setOutput('has_next', 'false');
              console.log('No more phase-next issues. All phases complete!');
            }

      - name: Assign Copilot to next issue
        if: steps.next.outputs.has_next == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.next.outputs.issue_number }};
            
            // Remove phase-next label, add in-progress
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              name: 'phase-next'
            }).catch(() => {});
            
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['in-progress', 'copilot']
            });
            
            // Assign to copilot (triggers Copilot coding agent)
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: ['copilot']  
            });
            
            // Comment to trigger and provide context
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🤖 **Auto-assigned by agent chain.** Previous task completed — this is now unblocked.\n\nUse the \`ios-builder\` agent profile. Read SPEC.md for full context.`
            });
            
            console.log(`Assigned Copilot to issue #${issueNumber}`);

      - name: Notify completion (all done)
        if: steps.next.outputs.has_next == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // Create a summary issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🎉 All queued phases complete',
              body: `All issues labeled \`phase-next\` have been processed.\n\nTriggered by: ${context.eventName} on ${context.sha.substring(0, 7)}`,
              labels: ['summary']
            });

  notify-stall:
    if: github.event.pull_request.merged == false && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Flag stalled PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ **PR closed without merge.** This may indicate a stall or rejection.\n\nReview needed — agent chain paused until this is resolved.`
            });
